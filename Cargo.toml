[workspace]
resolver = "2"
members = ["crates/pifbip-core", "crates/pifbip-cli", "crates/pifbip-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Put In Folder By Interactive Prompt — fast manual file sorting with preview and autocomplete"

[workspace.dependencies]
pifbip-core = { path = "crates/pifbip-core" }
clap = { version = "4", features = ["derive"] }
fuzzy-matcher = "0.3"
mime_guess = "2"
infer = "0.19"
