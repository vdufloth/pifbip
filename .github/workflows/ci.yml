name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install preview dependencies
        run: sudo apt-get update && sudo apt-get install -y chafa poppler-utils

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked -- --nocapture

      - name: Upload CLI scenario logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-scenario-logs
          path: target/cli-scenarios
          if-no-files-found: ignore
